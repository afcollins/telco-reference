---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: core-overlay-22
policyDefaults:
  namespace: ztp-core-policies
  policySets: []
  placement:
    labelSelector:
      matchLabels:
        common: "core"
        version: "4.22"
  remediationAction: "inform"
policies:
  # Baseline configuration with custom overlay content
  - name: core-overlay-base-4.22
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "2"
    manifests:
      # ICSP/IDMS/ITMS content will be entirely custom, thus including that in this policy
      - path: reference-crs/required/other/idms.yaml
        patches:
        - spec:
            imageDigestMirrors:
            - mirrors:
              - example.com/sample-path
              source: nomatch.io/sample-path
      - path: reference-crs/optional/other/sctp_module_mc.yaml
        complianceType: mustonlyhave
      - path: reference-crs/optional/other/worker-load-kernel-modules.yaml
        complianceType: mustonlyhave
      - path: reference-crs/optional/other/control-plane-load-kernel-modules.yaml
        complianceType: mustonlyhave
      - path: reference-crs/optional/networking/multus/tap_cni/mc_rootless_pods_selinux.yaml

      # Cert-manager configuration (optional component)
      # - path: reference-crs/optional/cert-manager/certManagerClusterIssuer.yaml
      #   patches:
      #   - spec:
      #       acme:
      #         server: https://acme-v02.api.letsencrypt.org/directory
      #         email: your-email@example.com
      #         privateKeySecretRef:
      #           name: acme-account-key
      # - path: reference-crs/optional/cert-manager/ingressCertificate.yaml
      #   patches:
      #   - spec:
      #       commonName: "*.apps.example.com"
      #       dnsNames:
      #       - "*.apps.example.com"
      # - path: reference-crs/optional/cert-manager/ingressControllerConfig.yaml
      # - path: reference-crs/optional/cert-manager/apiServerCertificate.yaml
      #   patches:
      #   - spec:
      #       commonName: "api.example.com"
      #       dnsNames:
      #       - "api.example.com"
      # - path: reference-crs/optional/cert-manager/apiServerConfig.yaml

  # Custom networking, operator and cluster configuration
  - name: core-overlay-config-4.22
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "8"
    manifests:
      # Set auto sizing of control plane nodes
      - path: reference-crs/optional/tuning/control-plane-system-reserved.yaml

      # Multus networks
      - path: reference-crs/required/networking/Network.yaml
        patches:
        - spec:
            additionalNetworks: []
      # - path: reference-crs/optional/networking/networkAttachmentDefinition.yaml

      # Numa aware scheduler, binding to mcp
      - path: reference-crs/required/scheduling/nrop.yaml
        patches:
        - spec:
            nodeGroups:
            - config:
                # Periodic is the default setting
                infoRefreshMode: Periodic
              machineConfigPoolSelector:
                matchLabels:
                  # This label must match the pool(s) you want to run NUMA-aligned workloads
                  machineconfiguration.openshift.io/role: worker-1
            - config:
                # Periodic is the default setting
                infoRefreshMode: Periodic
              machineConfigPoolSelector:
                matchLabels:
                  # This label must match the pool(s) you want to run NUMA-aligned workloads
                  pools.operator.machineconfiguration.openshift.io/master: ""

      # MCP PerformanceProfiles
      - path: reference-crs/required/performance/PerformanceProfile.yaml
        patches:
        - metadata:
            name: worker-profile-1
          spec:
            cpu:
              reserved: '0-7'
              isolated: '8-111'
            hugepages:
              pages:
              - count: 64
                size: 1G
            nodeSelector:
              node-role.kubernetes.io/worker-1: ""

      # Control plane PerformanceProfile
      - path: reference-crs/required/performance/PerformanceProfile-control-plane.yaml
        patches:
        - spec:
            cpu:
              reserved: '0-7,288-295'
              isolated: '8-287,296-575'
            hugepages:
              defaultHugepagesSize: 1G
              pages:
              - count: 64
                size: 1G

      # TuneD performance patches for core
      - path: reference-crs/required/performance/TunedPerformancePatch.yaml
        patches:
        - metadata:
            name: telco-core-performance-patch
          spec:
            recommend:
              - machineConfigLabels:
                  machineconfiguration.openshift.io/role: master
                priority: 18
                profile: control-plane-profile
              - machineConfigLabels:
                  machineconfiguration.openshift.io/role: worker-1
                priority: 18
                profile: worker-profile-1

      # Cluster Logging
      - path: reference-crs/optional/logging/ClusterLogForwarder.yaml
        patches:
        - spec:
            outputs:
            - type: "kafka"
              name: kafka-open
              kafka:
                url: '{{hub fromConfigMap "" "regional" (printf "%s-log-url" (index .ManagedClusterLabels "region")) | toLiteral hub}}'
            filters:
            - name: custom-labels
              type: openshiftLabels
              openshiftLabels:
                sitename: '{{hub fromConfigMap "" .ManagedClusterName "logging-name" | toLiteral hub}}'
                siteuuid: '{{hub fromConfigMap "" .ManagedClusterName "logging-uuid" | toLiteral hub}}'
                label3: 'other data'
            pipelines:
            - name: all-to-default
              inputRefs:
              - audit
              - infrastructure
              filterRefs:
              - custom-labels
              outputRefs:
              - kafka-open

      # Metal LB
      - path: reference-crs/required/networking/metallb/metallb.yaml
        patches:
        - spec:
            nodeSelector:
              node-role.kubernetes.io/worker: ""

      - path: reference-crs/required/networking/metallb/configurationstate.yaml

      - path: reference-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
        - metadata:
            name: intelx710
          spec:
            deviceType: netdevice
            nicSelector:
              pfNames:
                - 'eno12399'
                - 'eno12409'
                - 'eno12419'
                - 'eno12429'
            nodeSelector:
              sriov.network.intelx710: ''
            numVfs: 32
            priority: 99
            resourceName: intel
      - path: reference-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
        - metadata:
            name: intele810
          spec:
            deviceType: netdevice
            nicSelector:
              pfNames:
                - 'ens3f0'
                - 'ens3f1'
                - 'ens6f0'
                - 'ens6f1'
            nodeSelector:
              sriov.network.intele810: ''
            numVfs: 128
            priority: 99
            resourceName: intel
      - path: reference-crs/required/networking/sriov/sriovNetwork.yaml
        patches:
        - metadata:
            name: sriov-network-signal-1
          spec:
            capabilities: "{}"
            ipam: '{}'
            networkNamespace: signal-1
            resourceName: testSignaling
      - path: reference-crs/required/networking/sriov/sriovNetworkNodePolicy.yaml
        patches:
        - metadata:
            name: mellanox-cx6
          spec:
            deviceType: netdevice
            nicSelector:
              pfNames:
                - 'eno16695np0'
                - 'eno16705np1'
            nodeSelector:
              sriov.network.mellanoxnics.cx6: ""
            numVfs: 8
            priority: 99
            resourceName: mellanoxnicscx6

      #
      # Configure ODF
      #
      - path: reference-crs/required/storage/odf-external/01-rook-ceph-external-cluster-details.secret.yaml
        patches:
          - data:
              # encoded content has been made generic
              external_cluster_details: 

      - path: reference-crs/required/storage/odf-external/02-ocs-external-storagecluster.yaml

  # reference-crs/optional/networking/nodeNetworkConfigurationPolicy.yaml

  - name: config-monitoring-4.22
    # For consistency the name of this policy will be updated in a future release:
    # - name: core-overlay-monitoring-4.22
    policyAnnotations:
      ran.openshift.io/ztp-deploy-wave: "10"
    manifests:
      - path: reference-crs/optional/other/monitoring-config-cm.yaml
        complianceType: musthave
        patches:
        - data:
            # The config is a single string value in this map and default
            # content must be copied here in order to add custom content
            # (additionalAlertmanagerConfigs)
            config.yaml: |
              alertmanagerMain:
                volumeClaimTemplate:
                  spec:
                    storageClassName: ocs-external-storagecluster-ceph-rbd
                    resources:
                      requests:
                        storage: 20Gi
              prometheusK8s:
                retention: 15d
                volumeClaimTemplate:
                  spec:
                    storageClassName: ocs-external-storagecluster-ceph-rbd
                    resources:
                      requests:
                        storage: 100Gi
                additionalAlertmanagerConfigs:
                - scheme: "http"
                  pathPrefix: "/"
                  timeout: "30s"
                  apiVersion: "v1"
                  staticConfigs:
                  - "10.11.12.14:9999"
