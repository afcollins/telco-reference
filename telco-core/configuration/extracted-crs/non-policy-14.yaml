apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: placement-custom-mcp-unpause
  namespace: ztp-core-policies
spec:
  clusterSelector:
    matchExpressions:
    - key: common
      operator: In
      values:
      - core
    - key: version
      operator: In
      values:
      - '4.20'
